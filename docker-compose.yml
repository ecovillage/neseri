# Local Postgres for development/test - the only thing not covered by
# `mise install` + `bundle install`. Mirrors production (Postgres, native
# `pg` gem, no sqlite3 anywhere) instead of diverging from it.
#
#   docker compose up -d
#   bin/rails db:setup                 # development
#   RAILS_ENV=test bin/rails db:setup  # test
#
# config/database.yml points at 127.0.0.1:5432 with these same credentials
# by default (overridable via PGHOST/PGPORT/PGUSER/PGPASSWORD).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: neseri
      POSTGRES_PASSWORD: neseri
      POSTGRES_DB: neseri_development
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - neseri_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neseri"]
      interval: 2s
      timeout: 2s
      retries: 20

volumes:
  neseri_postgres_data:
