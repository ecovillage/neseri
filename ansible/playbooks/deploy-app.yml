---
# Deploys neseri to the Proxmox container without Docker: installs Ruby and
# Postgres natively, git-clones the app from GitHub, bundle installs,
# precompiles assets, migrates the database and (re)starts it under systemd.
#
# Caddy (both the container-internal instance and the Hostsharing public
# edge) is no longer configured from this repo - see the infrastructure
# repo's playbooks/neseri/inbound-routing.yml.
- name: Deploy neseri to the Proxmox container
  hosts: proxmox_container
  # ansible_user is already root on this container - no sudo needed (and a
  # minimal LXC template may not even have the sudo package installed).
  become: false
  roles:
    - neseri_app
