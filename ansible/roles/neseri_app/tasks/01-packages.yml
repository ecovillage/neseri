---
# Everything apt needs to install once: base tools, Postgres and mise
# (installs Ruby per-release - see 04-deploy.yml), all native - no Docker.
# Caddy is installed and configured separately, by the infrastructure repo's
# container-caddy role.

- name: Install base packages and native-gem build dependencies
  ansible.builtin.apt:
    name:
      - git
      - curl
      - ca-certificates
      - gnupg
      - build-essential  # native gems (pg, ...) still compile from source
      - autoconf         # via bundler regardless of how Ruby itself was
      - bison             # installed; these also cover mise falling back to
      - patch             # compiling Ruby from source when it has no
      - pkg-config         # precompiled binary for a given version/platform.
      - rustc          # needed to build Ruby's YJIT, if it comes to that
      - libssl-dev
      - libyaml-dev
      - libreadline-dev
      - zlib1g-dev
      - libgmp-dev
      - libncurses-dev
      - libffi-dev
      - libgdbm-dev
      - libgdbm-compat-dev
      - libpq-dev       # for the `pg` gem
      - libvips         # for image processing
      - imagemagick     # ditto - image_processing/ActiveStorage variants
                         # default to the mini_magick backend (shells out to
                         # `convert`) unless config.active_storage.variant_processor
                         # is set to :vips, and the app doesn't set it
      - python3-psycopg2 # for the community.postgresql ansible modules
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Install postgres
  ansible.builtin.apt:
    name:
      - postgresql
      - postgresql-contrib
    state: present

- name: Ensure postgresql is enabled and running
  ansible.builtin.systemd:
    name: postgresql
    state: started
    enabled: true

- name: Create the apt keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download and dearmor the mise apt signing key
  ansible.builtin.shell:
    cmd: >-
      curl -fsSL https://mise.jdx.dev/gpg-key.pub |
      gpg --dearmor -o /etc/apt/keyrings/mise-archive-keyring.gpg
  args:
    creates: /etc/apt/keyrings/mise-archive-keyring.gpg

- name: Add the mise apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/mise-archive-keyring.gpg arch=amd64] https://mise.jdx.dev/deb stable main"
    filename: mise
    state: present

- name: Install mise
  ansible.builtin.apt:
    name: mise
    state: present
