---
# Inventory for the neseri deployment.
#
# One target: proxmox_container, the Ubuntu 26.04 LXC container behind
# pfsense that actually runs the Rails app.
#
# The Hostsharing edge Caddy and the container's internal Caddy are no
# longer configured from here - that moved to the infrastructure repo
# (playbooks/neseri/inbound-routing.yml), which has its own inventory
# entries for both the container and the Hostsharing host.
all:
  children:
    proxmox_container:
      hosts:
        neseri-container:
          ansible_host: 192.168.1.135
          ansible_user: root
