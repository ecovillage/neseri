---
# Inventory for the neseri deployment.
#
# Two independent targets:
#   - caddy_edge:        the Hostsharing vHost that terminates the public TLS
#                         connection for neseri.siebenlinden.org and forwards
#                         it on to pfsense.
#   - proxmox_container:  the Ubuntu 26.04 LXC container behind pfsense that
#                         actually runs the Rails app.
all:
  children:
    caddy_edge:
      hosts:
        caddy-edge:
          ansible_host: vm4007.hostsharing.net
          ansible_user: tallyman
          # Hostsharing manages the whole box; we only ever touch
          # ~/caddy/config/Caddyfile inside this account.

    proxmox_container:
      hosts:
        neseri-container:
          ansible_host: 192.168.1.135
          ansible_user: root
