    files_text_html: "<b>Fotos</b>: bitte hochladen oder an <a href=\"mailto:bildungsreferat@siebenlinden.org\">bildungsreferat@siebenlinden.org</a>. Bitte ein digitales Portrait-Foto von dir für die Hompage, minimale Abmessungen 200 px in Breite oder Höhe. Dieses wird auf der Homepage kreisförmig dargestellt. Wenn vorhanden, auch gern zum Seminar passende andere Fotos (hier aber keine Garantie, dass sie auf die Homepage kommen). Es ist hilfreich, wenn die Bilder bereits in dem korrekten Seitenverhältnis vorliegen (720px x 340px), ansonsten versuchen wir daraus einen Ausschnitt zu wählen. Größer ist hier immer besser als kleiner. Dateigröße sollte mindestens 1 MB sein. <a href=\"https://siebenlinden.org/wp-content/uploads/2021/06/Vorgaben_Bilder_Webseite.pdf\">Weitere Hinweise und illustrierte Beispiele</a>. Stelle unbedingt sicher, dass die Bildrechte erlauben, die Bilder zur Veranstaltungsbewerbung und Öffentlichkeitsarbeit zu verwenden.</br>Es können auch andere für die Veranstaltung wichtige Dateien (z.B. Mitbringlisten, Info-Texte für mails, ...) angehängt werden."
    user_actions: Aktionen
    conditions: Konditionen
    conditions_text_html: |
      Die Referent*in/nen erklären sich damit einverstanden, <b>einen Seminarplatz (Regionalplatz)</b> für Menschen mit Wohnsitz in Sieben Linden <b>kostenlos</b> zur Verfügung zu stellen. Diese Person unterstützt die Referent*in/nen und ggf. Teilnehmer*innen in praktischen Fragen und informiert Teilnehmende auf Anfrage über Sieben Linden.</p> 
      <p>Wird das Seminar seitens der Referent*in/nen ohne vorliegen höherer Gewalt (z.B. schwere Krankheit) vor Ablauf der vereinbarten Absagefrist abgesagt, zahlt die Referent:in/nen eine <b>Ausfallpauschale</b> in Höhe von 200 €. Die Ausfallgebühr ist auch zu zahlen, wenn eine Ersatzveranstaltung für den Termin gefunden wurde bzw. der Seminartermin verlegt wurde. </p>
      <p>Bei Nicht-Zustandekommen aufgrund zu geringer Anzahl Anmeldungen beträgt die von der/den Referent:in/nen zu zahlende Ausfallpauschale bei Veranstaltungen bis zu 5 Tagen 50 €, ab 6 Tagen 100 €. Die Referent*in/nen reichen spätestens innerhalb 14 Tagen nach Seminardurchführung einen Ablaufplan/Konzept des Seminars beim Bildungsreferat ein. </p>
      <p>Die Referent:innentätigkeit im Rahmen des eingereichten Seminarangebots stellt eine <b>selbstständige Tätigkeit auf Honorarbasis</b> dar. </p>
      <h4>Datenschutz</h4>
      <p> Mit der Übernahme meiner/unserer Referent*innenrolle beim Freundeskreis Ökodorf e.V. akzeptiere(n) ich(wir) folgende Bedingungen: </p>
      <ol>
         <li>
            <b>Zweckbindung:</b><br/>
            Die übermittelten personenbezogenen Daten der Teilnehmenden (z. B. Name, E-Mail-Adresse) dürfen ausschließlich zur Vorbereitung, Durchführung und Nachbereitung des konkret benannten Seminars verwendet werden.
         </li>
         <li><b>Keine Weitergabe:</b><br/>
            Eine Weitergabe der Daten an Dritte oder
            deren Nutzung für andere Zwecke (z. B. Werbung, eigene Angebote)
            ist unzulässig.
         </li>
         <li><b>Löschung:</b><br/>
            Nach
            Abschluss des Seminars und Erfüllung des Kommunikationszwecks sind
            alle erhaltenen personenbezogenen Daten umgehend und
            datenschutzkonform zu löschen.
         </li>
         <li><b>Datenschutzkonformität:</b><br/>
            Es
            gelten die Bestimmungen der Datenschutz-Grundverordnung (DSGVO) und
            des Bundesdatenschutzgesetzes (BDSG). Die Referent*innen tragen
            Verantwortung für den sicheren Umgang mit den Daten.
         </li>
      </ol>
      <p><b>Bildrechte: </b>Der
         im Passus „Bildrechte“ der <a href="https://siebenlinden.org/de/seminare/agb/">AGBs</a>
         für Seminarteilnehmende gilt gleichfalls für Referent:innen.
      </p>
      <p><big><b>Meine Co-Referent:innen sind über diese Vereinbarungen informiert und bestätigen diese.</b></big></p>
