    files_text_html: "<b>Photos</b>: please upload them or send them to <a href=\"mailto:bildungsreferat@siebenlinden.org\">bildungsreferat@siebenlinden.org</a>. Please include a digital portrait photo of yourself for the website, at least 200 px in width or height. It will be shown cropped to a circle on the website. If available, feel free to add other photos that fit the seminar too (though there's no guarantee they'll be used on the website). It helps if the images are already in the right aspect ratio (720px x 340px), otherwise we'll try to crop them. Bigger is always better than smaller here. File size should be at least 1 MB. <a href=\"https://siebenlinden.org/wp-content/uploads/2021/06/Vorgaben_Bilder_Webseite.pdf\">Further notes and illustrated examples</a>. Please make sure the image rights allow the photos to be used for event promotion and public relations.</br>Other files relevant to the event (e.g. packing lists, info texts for emails, ...) can also be attached."
    user_actions: Actions
    conditions: Conditions
    conditions_text_html: |
      The instructor(s) agree to make <b>one seminar place (regional place)</b> available <b>free of charge</b> for people living in Sieben Linden. This person supports the instructor(s) and, where applicable, participants with practical questions and informs participants about Sieben Linden on request.</p>
      <p>If the seminar is cancelled by the instructor(s) without a case of force majeure (e.g. serious illness) before the agreed cancellation deadline, the instructor(s) shall pay a <b>cancellation fee</b> of €200. This fee is also due if a replacement event was found for the date, or the seminar date was rescheduled.</p>
      <p>If the seminar does not take place due to too few registrations, the cancellation fee to be paid by the instructor(s) is €50 for events of up to 5 days, and €100 from 6 days on. The instructor(s) shall submit a schedule/concept of the seminar to the education office no later than 14 days after the seminar takes place.</p>
      <p>Working as an instructor within the submitted seminar offer constitutes <b>self-employed work on a fee basis</b>.</p>
      <h4>Data protection</h4>
      <p>By taking on my/our role as instructor(s) for Freundeskreis Ökodorf e.V., I/we accept the following conditions:</p>
      <ol>
         <li>
            <b>Purpose limitation:</b><br/>
            The personal data of participants provided to us (e.g. name, email address) may only be used to prepare, run, and follow up on the specifically named seminar.
         </li>
         <li><b>No disclosure:</b><br/>
            Passing the data on to third parties, or using it for other purposes (e.g. advertising, own offers), is not permitted.
         </li>
         <li><b>Deletion:</b><br/>
            After the seminar has ended and its communication purpose has been fulfilled, all personal data received must be deleted promptly and in a data-protection-compliant manner.
         </li>
         <li><b>Data protection compliance:</b><br/>
            The provisions of the General Data Protection Regulation (GDPR) and the German Federal Data Protection Act (BDSG) apply. Instructors are responsible for handling the data securely.
         </li>
      </ol>
      <p><b>Image rights: </b>The passage on "image rights" in the <a href="https://siebenlinden.org/de/seminare/agb/">terms and conditions</a> for seminar participants applies equally to instructors.
      </p>
      <p><big><b>My co-instructors have been informed of these terms and confirm them.</b></big></p>
